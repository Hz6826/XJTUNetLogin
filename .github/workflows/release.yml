name: Build & Release

on:
  push:
    tags:
      - 'v[0-9]*'          # 收窄触发器：必须以 v + 数字开头，其它 tag 直接不触发
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v 前缀，如 1.0.0 或 1.0.0-rc.1）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_VERSION: '6.8.3'
      MINGW_TOOL: 'tools_mingw1310'    # Qt 6.8.3 配套的 GCC 13.1.0
      BUILD_TYPE: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0                # 完整 git 历史，GetGitVersion.cmake 需要

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.4.0
        with:
          version: ${{ env.QT_VERSION }}
          arch: 'win64_mingw'
          tools: ${{ env.MINGW_TOOL }}  # ★ 装 Qt 自带的 MinGW
          cache: true

      # ---------- 版本号：归一化 + 严格校验（失败即停）----------
      - name: Resolve & validate version
        id: ver
        shell: pwsh
        run: |
          # 1) 取原始版本号
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $raw = "${{ github.event.inputs.version }}".Trim()
          } else {
            $raw = "${{ github.ref_name }}".Trim()
          }

          # 2) 统一剥掉前缀 v（大小写兼容）
          $normalized = $raw -replace '^[vV]', ''

          # 3) semver.org 官方正则严格校验
          $semverPattern = '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$'
          $m = [regex]::Match($normalized, $semverPattern)
          if (-not $m.Success) {
            Write-Host "::error::版本号不合法：原始='$raw'，归一化后='$normalized'"
            Write-Host "::error::期望格式：MAJOR.MINOR.PATCH[-PRERELEASE][+BUILD]，如 1.0.0、1.2.3-rc.1"
            exit 1
          }

          # 4) 严格按 semver 判断：仅 -PRERELEASE 段存在才算预发布
          #    Groups[4] 即 -PRERELEASE 段（不含前导 '-'），Groups[5] 是 +BUILD
          $prerelease   = $m.Groups[4].Value
          $isPrerelease = -not [string]::IsNullOrEmpty($prerelease)

          # 5) Inno Setup 用纯数字版本（AppVersion 不接受 -PRERELEASE）
          $numeric = "$($m.Groups[1].Value).$($m.Groups[2].Value).$($m.Groups[3].Value)"

          "version=$normalized"                     >> $env:GITHUB_OUTPUT
          "version_numeric=$numeric"                >> $env:GITHUB_OUTPUT
          "is_prerelease=$($isPrerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT

          Write-Host "Raw:           $raw"
          Write-Host "Normalized:    $normalized"
          Write-Host "Numeric:       $numeric"
          Write-Host "Is prerelease: $isPrerelease"

      # ---------- 定位 Qt MinGW ----------
      - name: Locate Qt MinGW
        id: mingw
        shell: pwsh
        run: |
          $mingwRoot = "$env:QT_ROOT_DIR\..\..\Tools"
          $mingwDir = Get-ChildItem $mingwRoot -Directory -Filter 'mingw*_64' `
                      -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $mingwDir) {
            Write-Host "::error::Qt MinGW not found under $mingwRoot"
            Get-ChildItem $mingwRoot -ErrorAction SilentlyContinue | Format-Table
            exit 1
          }
          $mingwBin = "$($mingwDir.FullName)\bin"
          Write-Host "Using MinGW: $mingwBin"
          & "$mingwBin\g++.exe" --version | Select-Object -First 1
          "bin=$mingwBin" >> $env:GITHUB_OUTPUT

      # ---------- 配置 ----------
      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -S . `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_C_COMPILER="${{ steps.mingw.outputs.bin }}\gcc.exe" `
            -DCMAKE_CXX_COMPILER="${{ steps.mingw.outputs.bin }}\g++.exe" `
            "-DXJTU_VERSION=${{ steps.ver.outputs.version }}"

      # ---------- 构建 ----------
      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      # ---------- 收集许可证（便携版+安装版共用）----------
      - name: Collect LICENSES
        shell: pwsh
        run: |
          $dst = "build\bin\LICENSES"
          New-Item -ItemType Directory -Force -Path "$dst\Qt" | Out-Null

          # 1) Qt 的许可证全文 —— 直接从 Qt 安装目录拷
          $qtLic = Join-Path $env:QT_ROOT_DIR "LICENSES"
          if (Test-Path $qtLic) {
            Copy-Item "$qtLic\*" -Destination "$dst\Qt\" -Recurse -Force
            Write-Host "Copied $((Get-ChildItem $qtLic -Recurse -File).Count) files from Qt LICENSES"
          } else {
            Write-Host "::warning::Qt LICENSES not found at $qtLic"
          }

          # 2) 仓库自带的 LICENSES（含 NOTICE.txt / GCC-exception / MIT）
          Copy-Item "packaging\LICENSES\*" -Destination $dst -Recurse -Force

          # 打印核对
          Get-ChildItem $dst -Recurse -File |
            ForEach-Object { Write-Host "  $($_.FullName.Replace("$PWD\",''))" }

      # ---------- 便携版 ----------
      - name: Prepare portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item -Path build\bin\* -Destination portable\ -Recurse -Force
          # 主题保持外置：随便携版放在 exe 同目录，运行时从 <exe dir>\themes 读取
          Copy-Item -Path themes -Destination portable\ -Recurse -Force
          # 无 BOM 的空 JSON —— 便携版标记
          [System.IO.File]::WriteAllText("$PWD\portable\config.json", "{}")

      - name: Verify portable runtime DLLs
        shell: pwsh
        run: |
          $required = @(
            'libgcc_s_seh-1.dll',
            'libstdc++-6.dll',
            'libwinpthread-1.dll',
            'Qt6Core.dll',
            'Qt6Gui.dll',
            'Qt6Widgets.dll',
            'Qt6Network.dll',
            'Qt6Svg.dll',
            'platforms\qwindows.dll'
          )
          $missing = @()
          foreach ($f in $required) {
            if (-not (Test-Path "portable\$f")) { $missing += $f }
          }
          if ($missing.Count -gt 0) {
            Write-Host "::error::Missing runtime files in portable package:"
            $missing | ForEach-Object { Write-Host "  - $_" }
            exit 1
          }
          Write-Host "All required runtime DLLs present."

      - name: Zip portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path portable\* `
                           -DestinationPath "dist\XJTUNetLogin-Portable-${{ steps.ver.outputs.version }}.zip"

      # ---------- 安装版 ----------
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion="${{ steps.ver.outputs.version }}" `
            packaging\installer.iss

      # ---------- 上传 ----------
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: XJTUNetLogin-${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          draft: false
          prerelease: ${{ steps.ver.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
